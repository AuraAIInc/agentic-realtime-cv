# camera_sim configuration. Identity/model values mirrored from the 2026-11-01
# camera_v3 log; CLI flags override the replay range / speed (see README.md).
# Run from agent/: python -m camera_sim

# --- identity: stamped on every streamed message, same keys as camera_server ---
device_id: "sim-camera-01"  # the real camera stamps the Pi serial
view_id: 3
model_id: 70
user_id: "sim-user"
user_name: "sim"
cat_names:
  # <cat tracker id>: "<name>"  (used only by models with cat_classes: true)
  25: "Qb-2"
  26: "Qbo-2"

# --- replay source: <stamp>.jpg or NNNN_<stamp>.jpg under images/, any subfolders ---
image_dir: "../image_server/retrieved_images"  # relative to agent/ (where camera_sim runs)
replay_start: "2026-10-26-02-00-00"  # inclusive; hour dir, name prefix, or full name
replay_end: ""  # inclusive; "" = to the last image
replay_speed: 1.0  # 1.0 = realtime pacing from the file timestamps; 0 = as fast as possible
max_gap_sleep: 2.0  # never sleep longer than this between frames (skips long gaps)
loop: false  # restart from the first image when the range is exhausted
limit: 0  # max frames to serve, 0 = all
exit_when_done: true  # shut down once the range is fully streamed (ignored with loop)

# --- image geometry (retrieved images are 800x600) ---
camera_img_size: [800, 600]  # display space; detection boxes use this, as on the Pi
capture_size: null  # null = same as camera_img_size
# model_img_size is derived as (w//32*32, h//32*32) = (800, 576), matching the log

# --- detection output: byte-identical schema to the camera_server stream ---
ws_enabled: true
ws_url: "ws://127.0.0.1:8000"  # detection_ingest_server.py listens here
q_max: 2000
output_jsonl: ""  # e.g. "sim_output.jsonl" to also tee every message to a file
loop_model: "default"  # always-on loop model; the log shows the loop runs "default" (best.pt)

# --- models: same schema as camera_v3/models.json ---
models_config: "models.json"  # relative to this folder unless absolute
model_s3_save_path: ""  # optional s3 key of best.pt (fallback s3_key for the default model); "" = use models/best.pt
model_training_bucket_name: ""  # training bucket for the optional S3 model download
extra_models: {}

# --- frame look-back / tracks, same as camera_server ---
frame_buffer_size: 120
frame_buffer_jpeg_quality: 85

# --- MCP control server: same tools as camera_server ---
mcp_enabled: true
mcp_host: "127.0.0.1"  # camera uses 0.0.0.0; localhost for the local sim
mcp_port: 8766  # camera uses 8765; 8766 avoids a clash when both run
mcp_auth_token: null  # null = use $MCP_AUTH_TOKEN; set a string to override

log_level: "INFO"
