<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --bg:#1a1a19; --panel:#232321; --panel2:#2b2b28; --line:#3a3935;
  --t1:#f2f1ed; --t2:#c3c2b7; --t3:#8e8d84;
  --qb:#3987e5; --qbo:#d95926; --edge:#199e70; --agent:#9085e9;
  --doubt:#fab219; --good:#0ca30c; --bad:#e66767;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"SF Mono",Menlo,monospace}
.slide{position:absolute;inset:0;padding:88px 112px 110px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);font-weight:600}
h1{font-size:76px;line-height:1.06;font-weight:700;letter-spacing:-.02em}
h2{font-size:56px;line-height:1.1;font-weight:700;letter-spacing:-.015em}
.lead{font-size:34px;line-height:1.4;color:var(--t2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:36px 40px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;
  font-size:24px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.frame{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.frame img{display:block;width:100%;height:100%}
.box{position:absolute;border:4px solid;border-radius:6px}
.tag{position:absolute;padding:6px 14px;border-radius:10px;font-size:24px;font-weight:700;white-space:nowrap;color:#111}
.foot{position:absolute;left:112px;right:112px;bottom:48px;font-size:20px;color:var(--t3);display:flex;justify-content:space-between}
.stamp{display:inline-block;padding:10px 26px;border:4px solid;border-radius:14px;font-size:40px;font-weight:800;letter-spacing:.06em;transform:rotate(-4deg)}
</style></head>
<body><div class="slide"><div class="kicker">The loop</div>

oke-width="3" marker-end="url(#ah)"/><text x="1207.5" y="121.0" font-size="22" fill="#8e8d84" text-anchor="middle">no</text><rect x="820" y="400" width="380" height="220" rx="20" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="820" y="400" width="10" height="220" rx="5" fill="#fab219"/><text x="854" y="452" font-size="32" font-weight="700" fill="#f2f1ed">Plain-English</text><text x="854" y="494" font-size="24" fill="#c3c2b7">question + key frames</text><text x="854" y="528" font-size="24" fill="#c3c2b7">+ strict JSON schema</text><text x="854" y="562" font-size="24" fill="#c3c2b7">≤4 cases per call</text><rect x="1290" y="400" width="406" height="220" rx="20" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="1290" y="400" width="10" height="220" rx="5" fill="#9085e9"/><text x="1324" y="452" font-size="32" font-weight="700" fill="#f2f1ed">Muse Spark agent</text><text x="1324" y="494" font-size="24" fill="#c3c2b7">pulls frames via MCP</text><text x="1324" y="528" font-size="24" fill="#c3c2b7">compares the cats</text><text x="1324" y="562" font-size="24" fill="#c3c2b7">verdict + rationale</text><line x1="1010" y1="230" x2="1010" y2="395" stroke="#8e8d84" stroke-width="3" marker-end="url(#ah)"/><text x="1030" y="320" font-size="22" fill="#8e8d84" text-anchor="start">yes · ~1%</text><line x1="1200" y1="510" x2="1285" y2="510" stroke="#8e8d84" stroke-width="3" marker-end="url(#ah)"/><path d="M1493,400 L1493,236" stroke="#9085e9" stroke-width="3" fill="none" marker-end="url(#ah)"/><text x="1478" y="326" font-size="22" fill="#c3c2b7" text-anchor="end">verdict rewrites rows</text><rect x="0" y="400" width="700" height="220" rx="20" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="0" y="400" width="10" height="220" rx="5" fill="#3987e5"/><text x="34" y="452" font-size="32" font-weight="700" fill="#f2f1ed">Spatial-temporal memory</text><text x="34" y="494" font-size="24" fill="#c3c2b7">trusted visits → day log (plain text)</text><text x="34" y="528" font-size="24" fill="#c3c2b7">cells → zones → view · 5 min → hour → day → week</text><text x="34" y="562" font-size="24" fill="#c3c2b7">brief attached to the next question</text><path d="M1493,620 L1493,700 L350,700 L350,624" stroke="#3987e5" stroke-width="3" fill="none" marker-end="url(#ah)"/><text x="922" y="740" font-size="22" fill="#c3c2b7" text-anchor="middle">trusted visits + verdicts</text><line x1="700" y1="510" x2="815" y2="510" stroke="#8e8d84" stroke-width="3" marker-end="url(#ah)"/><text x="757" y="492" font-size="22" fill="#8e8d84" text-anchor="middle">brief</text></svg></div></div></body></html>
