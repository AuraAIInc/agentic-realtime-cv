<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --bg:#1a1a19; --panel:#232321; --panel2:#2b2b28; --line:#3a3935;
  --t1:#f2f1ed; --t2:#c3c2b7; --t3:#8e8d84;
  --qb:#3987e5; --qbo:#d95926; --edge:#199e70; --agent:#9085e9;
  --doubt:#fab219; --good:#0ca30c; --bad:#e66767;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"SF Mono",Menlo,monospace}
.slide{position:absolute;inset:0;padding:88px 112px 110px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);font-weight:600}
h1{font-size:76px;line-height:1.06;font-weight:700;letter-spacing:-.02em}
h2{font-size:56px;line-height:1.1;font-weight:700;letter-spacing:-.015em}
.lead{font-size:34px;line-height:1.4;color:var(--t2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:36px 40px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;
  font-size:24px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.frame{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.frame img{display:block;width:100%;height:100%}
.box{position:absolute;border:4px solid;border-radius:6px}
.tag{position:absolute;padding:6px 14px;border-radius:10px;font-size:24px;font-weight:700;white-space:nowrap;color:#111}
.foot{position:absolute;left:112px;right:112px;bottom:48px;font-size:20px;color:var(--t3);display:flex;justify-content:space-between}
.stamp{display:inline-block;padding:10px 26px;border:4px solid;border-radius:14px;font-size:40px;font-weight:800;letter-spacing:.06em;transform:rotate(-4deg)}
</style></head>
<body><div class="slide"><div class="kicker">How does it work?</div><h2 style="margin-top:14px">The Pi handles 99% of frames; the agent sees only the doubts.</h2>

da">~1% of frames escalate</text><circle cx="796" cy="591" r="4.5" fill="#fab219"/><text x="812" y="598" font-size="22" fill="#e4e2da">related doubts merged: 12 → 5 calls</text><rect x="1262" y="268" width="434" height="352" rx="26" fill="#9085e9" fill-opacity=".09" stroke="#9085e9" stroke-opacity=".5" stroke-width="2"/><circle cx="1288" cy="294" r="15" fill="#9085e9"/><text x="1288" y="301" font-size="19" font-weight="800" fill="#111" text-anchor="middle">2</text><text x="1312" y="302" font-size="22" font-weight="700" fill="#9085e9">Agent tools + skills</text><circle cx="1300" cy="523" r="4.5" fill="#9085e9"/><text x="1316" y="530" font-size="22" fill="#e4e2da">39 tools: camera, images, tracking</text><circle cx="1300" cy="557" r="4.5" fill="#9085e9"/><text x="1316" y="564" font-size="22" fill="#e4e2da">5 skills, loaded on demand</text><circle cx="1300" cy="591" r="4.5" fill="#9085e9"/><text x="1316" y="598" font-size="22" fill="#e4e2da">cheapest evidence first</text><rect x="18" y="60" width="300" height="140" rx="18" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="18" y="60" width="10" height="140" rx="5" fill="#199e70"/><text x="50" y="106" font-size="29" font-weight="700" fill="#f2f1ed">Pi camera</text><text x="50" y="144" font-size="22" fill="#c3c2b7">YOLO, every frame</text><text x="50" y="175" font-size="22" fill="#c3c2b7">2 fps · ~free</text><rect x="372" y="60" width="330" height="140" rx="18" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="372" y="60" width="10" height="140" rx="5" fill="#199e70"/><text x="404" y="106" font-size="29" font-weight="700" fill="#f2f1ed">Correctors</text><text x="404" y="144" font-size="22" fill="#c3c2b7">boxes → tracks → visits</text><text x="404" y="175" font-size="22" fill="#c3c2b7">name their own doubt</text><polygon points="980,56 1092,130 980,204 868,130" fill="#2b2b28" stroke="#fab219" stroke-width="3" stroke-linejoin="round"/><text x="980" y="140" font-size="29" font-weight="700" fill="#f2f1ed" text-anchor="middle">Unsure?</text><rect x="1290" y="60" width="406" height="140" rx="18" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="1290" y="60" width="10" height="140" rx="5" fill="#8e8d84"/><text x="1322" y="106" font-size="29" font-weight="700" fill="#f2f1ed">Tracked rows</text><text x="1322" y="144" font-size="22" fill="#c3c2b7">committed as-is</text><text x="1322" y="175" font-size="22" fill="#c3c2b7">99% of frames</text><path d="M318,130 L366,130" stroke="#8e8d84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M702,130 L862,130" stroke="#8e8d84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1092,130 L1284,130" stroke="#8e8d84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1247" y="116" font-size="21" fill="#c3c2b7" text-anchor="middle">no</text><rect x="18" y="320" width="610" height="160" rx="18" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="18" y="320" width="10" height="160" rx="5" fill="#3987e5"/><text x="50" y="366" font-size="29" font-weight="700" fill="#f2f1ed">Memory</text><text x="50" y="404" font-size="22" fill="#c3c2b7">trusted visits → plain-text day log</text><text x="50" y="435" font-size="22" fill="#c3c2b7">brief rides with the next question</text><rect x="790" y="320" width="380" height="160" rx="18" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="790" y="320" width="10" height="160" rx="5" fill="#fab219"/><text x="822" y="366" font-size="29" font-weight="700" fill="#f2f1ed">Plain-English</text><text x="822" y="404" font-size="22" fill="#c3c2b7">question + key frames</text><text x="822" y="435" font-size="22" fill="#c3c2b7">strict JSON answer</text><rect x="1290" y="320" width="390" height="160" rx="18" fill="#232321" stroke="#3a3935" stroke-width="2"/><rect x="1290" y="320" width="10" height="160" rx="5" fill="#9085e9"/><text x="1322" y="366" font-size="29" font-weight="700" fill="#f2f1ed">Muse Spark agent</text><text x="1322" y="404" font-size="22" fill="#c3c2b7">pulls the frames it needs</text><text x="1322" y="435" font-size="22" fill="#c3c2b7">verdict + rationale</text><path d="M980,204 L980,314" stroke="#8e8d84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="994" y="262" font-size="21" fill="#c3c2b7" text-anchor="start">yes · ~1%</text><path d="M1170,400 L1284,400" stroke="#8e8d84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M628,400 L784,400" stroke="#8e8d84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="706" y="386" font-size="21" fill="#c3c2b7" text-anchor="middle">brief</text><path d="M1640,320 L1640,206" stroke="#9085e9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahv)"/><text x="1626" y="244" font-size="21" fill="#c3c2b7" text-anchor="end">verdict rewrites rows</text><path d="M1479,620 L1479,640 Q1479,664 1455,664 L349,664 Q325,664 325,640 L325,626" stroke="#3987e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahb)"/><text x="902" y="700" font-size="21" fill="#c3c2b7" text-anchor="middle">trusted visits + verdicts</text></svg></div></div></body></html>
